name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "scores/**"
      - "games/**"
      - "sitemap.xml"
      - "robots.txt"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Submit scores and games URLs to IndexNow
        run: node scripts/indexnow.mjs
