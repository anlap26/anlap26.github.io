name: Refresh scores pages

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scores-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild crawlable scores pages
        run: node scripts/build-scores-seo.mjs
      - name: Commit fresh fixtures when they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores sitemap.xml
          if git diff --cached --quiet; then
            echo "No score changes"
          else
            git commit -m "Refresh Harbourline score snapshots"
            git push
          fi
      - name: Tell IndexNow about the scores URLs
        run: node scripts/indexnow.mjs
